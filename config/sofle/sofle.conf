# Enable the OLED Display
CONFIG_ZMK_DISPLAY=y

# Enable encoder support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Increase transmit power of BLE radio
# Connectivity between keyboard and my MacBook
# seems to be a bit poor, possibly due to the
# metal housing of the host.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# eager debouncing
# see here: https://zmk.dev/docs/features/debouncing#eager-debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
